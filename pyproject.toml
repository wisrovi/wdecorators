[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wdecorators"
version = "1.1.0"
authors = [
    { name="wisrovi", email="wisrovi.rodriguez@gmail.com" },
]
description = "A high-level Python decorator library for performance, resilience, debugging, and more."
readme = "README.md"
license = { file="LICENSE" }
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Intended Audience :: Developers",
]
dependencies = [
    "loguru",
]

[project.optional-dependencies]
scheduler = [
    "fastapi>=0.95.0",
    "uvicorn>=0.20.0",
    "pyjwt>=2.0.0",
    "jinja2>=3.0.0",
    "python-multipart>=0.0.5",
]
graylog = [
    "fastapi>=0.95.0",
]

[project.urls]
"Homepage" = "https://github.com/wisrovi/wdecorators"
"Bug Tracker" = "https://github.com/wisrovi/wdecorators/issues"

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.black]
line_length = 88
target_version = ["py37", "py38", "py39", "py310", "py311"]
include = '\.py$'
skip_magic_trailing_comma = true
